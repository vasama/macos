name: macOS SSH session
description: Open an SSH session into the macOS runner through a Cloudflare quick tunnel.

inputs:
  timeout:
    description: How long to keep the session open, 1-350 minutes.
    default: "60"
  github-user:
    description: GitHub user whose published SSH keys (github.com/<user>.keys) may log in.
    default: ${{ github.triggering_actor }}
  authorized-keys:
    description: Additional authorized_keys lines that may log in.
    default: ""

runs:
  using: composite
  steps:
    - name: Check runner OS
      if: runner.os != 'macOS'
      shell: pwsh
      run: |
        Write-Host '::error::This action only supports macOS runners.'
        exit 1

    - name: Install cloudflared
      shell: pwsh
      run: |
        if (-not (Get-Command cloudflared -ErrorAction Ignore)) {
          $Arch = @{ X64 = 'amd64'; ARM64 = 'arm64' }[$env:RUNNER_ARCH]
          if (-not $Arch) {
            Write-Host "::error::No cloudflared release for runner architecture $env:RUNNER_ARCH."
            exit 1
          }
          $Dir = Join-Path $env:RUNNER_TEMP 'cloudflared'
          $Archive = Join-Path $Dir 'cloudflared.tgz'
          New-Item -ItemType Directory -Force -Path $Dir | Out-Null
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-$Arch.tgz" -OutFile $Archive -MaximumRetryCount 3
          tar -xzf $Archive -C $Dir
          Add-Content -Path $env:GITHUB_PATH -Value $Dir
        }

    # Inputs reach the script through env rather than being expanded into
    # the command line, where they would be parsed as PowerShell code.
    - name: SSH session
      shell: pwsh
      run: |
        ${{ github.action_path }}/scripts/Start-Session.ps1 `
          -GitHubUser $env:INPUT_GITHUB_USER `
          -AuthorizedKeys $env:INPUT_AUTHORIZED_KEYS `
          -Timeout $env:INPUT_TIMEOUT
      env:
        INPUT_GITHUB_USER: ${{ inputs.github-user }}
        INPUT_AUTHORIZED_KEYS: ${{ inputs.authorized-keys }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
