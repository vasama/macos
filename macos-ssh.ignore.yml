# Copy this file to .github/workflows/macos-ssh.yml in your repository, then
# start a session from the Actions tab or with `gh workflow run macos-ssh.yml`.
# See https://github.com/vasama/macos for details.
name: macOS SSH session

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (macos-latest, macos-15, macos-14, ...)
        type: string
        default: macos-latest
      minutes:
        description: Minutes to keep the session open (1-350)
        type: number
        default: 60

permissions:
  contents: read

jobs:
  ssh:
    name: SSH on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    # Hard cap for GitHub-hosted runners; the session normally ends after `minutes`.
    timeout-minutes: 360
    steps:
      # Your repository, so it is there to work on during the session. Add
      # build or setup steps here to have them done before you log in.
      - uses: actions/checkout@v5

      - uses: vasama/macos@main
        with:
          minutes: ${{ inputs.minutes }}
          # Optional extra keys, as a repository variable with authorized_keys lines.
          authorized-keys: ${{ vars.SSH_AUTHORIZED_KEYS }}
